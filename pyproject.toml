[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origin-memorycore"
version = "0.1.0"
description = "MCP memory tiering server — hot local tier + cold remote tier with automatic overflow for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "moonandecho" }]
keywords = ["mcp", "memory", "llm", "agent", "fastmcp", "hermes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp>=1.0,<2", "mnemosyne-memory>=3.15.1,<4", "uvicorn>=0.30", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/moonandecho/origin-memorycore"

[tool.setuptools.packages.find]
include = ["memorycore*"]

[tool.setuptools.package-data]
